[package]
name = "mh-agent-loop"
version = "0.1.0"
edition = "2021"

[dependencies]
minerva-plugin-sdk = { path = "../../crates/plugin-sdk" }
mh-sessions = { path = "../mh-sessions" }
mh-plugin-manager = { path = "../mh-plugin-manager" }
cordis-rs = "=0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "process", "io-util"] }
[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
tempfile = "3"
