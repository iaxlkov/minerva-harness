[package]
name = "mh-skills"
version = "0.1.0"
edition = "2021"

[dependencies]
minerva-plugin-sdk = { path = "../../crates/plugin-sdk" }
mh-tool-runtime = { path = "../mh-tool-runtime" }
cordis-rs = "=0.11.1"
cap-std = "3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
