[package]
name = "mh-tool-runtime"
version = "0.1.0"
edition = "2021"

[dependencies]
minerva-plugin-sdk = { path = "../../crates/plugin-sdk" }
cordis-rs = "=0.11.1"
rig-core = { version = "0.46.0", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "0.46.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.33", default-features = false }
cap-std = "3"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "process", "io-util"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile = "3"
