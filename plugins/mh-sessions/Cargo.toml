[package]
name = "mh-sessions"
version = "0.1.0"
edition = "2021"

[dependencies]
minerva-plugin-sdk = { path = "../../crates/plugin-sdk" }
cordis-rs = "=0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
[dev-dependencies]
tempfile = "3"
