[package]
name = "mh-workspaces"
version = "0.1.0"
edition = "2021"

[dependencies]
mh-context = { path = "../mh-context" }
mh-sessions = { path = "../mh-sessions" }
cordis-rs = "=0.11.1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "=12.0.1", features = ["serde-json-impl"] }
[dev-dependencies]
tempfile = "3"
