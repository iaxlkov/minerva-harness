[package]
name = "minerva-api"
version = "0.1.0"
edition = "2021"

[dependencies]
minerva-runtime = { path = "../runtime" }
minerva-worker-auth = { path = "../worker-auth" }
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "1", features = ["net", "signal", "rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
futures-util = "0.3"
url = "2"
subtle = "2"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls"] }
tokio-tungstenite = "0.28"
