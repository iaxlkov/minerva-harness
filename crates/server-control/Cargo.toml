[package]
name = "minerva-server-control"
version = "0.1.0"
edition = "2021"

[dependencies]
openidconnect = { version = "3.5", default-features = false, features = ["reqwest", "rustls-tls"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ring = "0.17"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = "0.4"
