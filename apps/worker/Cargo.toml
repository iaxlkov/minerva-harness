[package]
name = "minerva-worker"
version = "0.1.0"
edition = "2021"
[dependencies]
minerva-api = { path = "../../crates/api" }
minerva-runtime = { path = "../../crates/runtime" }
minerva-worker-auth = { path = "../../crates/worker-auth" }
tokio = { version = "1", features = ["net", "signal", "macros", "rt-multi-thread"] }
axum = "=0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
