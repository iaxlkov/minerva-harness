[package]
name = "minerva-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
minerva-server-control = { path = "../../crates/server-control" }
minerva-worker-auth = { path = "../../crates/worker-auth" }
axum = { version = "=0.8.9", features = ["ws", "query"] }
tokio = { version = "1", features = ["net", "signal", "rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1"] }
postgres-native-tls = "0.5"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
base64 = "0.22"
thiserror = "2"
